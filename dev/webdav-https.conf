# TLS in front of the plain `webdav` service. Apache refuses a MOVE whose Destination has another
# scheme or host than the request it received, so that header is rewritten to match.
map $http_destination $backend_destination {
  default $http_destination;
  ~^https?://[^/]+(?<rest>.*)$ http://webdav$rest;
}

server {
  listen 443 ssl;
  ssl_certificate /tls/cert.pem;
  ssl_certificate_key /tls/privkey.pem;
  client_max_body_size 0;

  location / {
    proxy_pass http://webdav;
    proxy_set_header Host webdav;
    proxy_set_header Destination $backend_destination;
    # Apache redirects a folder to its name with a slash. Keep the client on this port and scheme.
    proxy_redirect http://webdav/ https://$http_host/;
  }
}
